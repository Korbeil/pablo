name: CI
on:
  push:
    branches: [ "main" ]
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every job sets PHP, Composer's cache and Castor up through the same local
# composite action (.github/actions/setup), so they cannot drift apart.
jobs:
  cs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: ./.github/actions/setup
      - name: 'php-cs-fixer check'
        run: 'castor qa:cs:check'
      - name: 'twig-cs-fixer check'
        run: 'castor qa:twig-cs:check'
  composer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.5
          coverage: none
          tools: composer
      - name: 'composer validate (app)'
        working-directory: app
        run: composer validate --strict
      - name: 'composer audit (app)'
        working-directory: app
        run: composer audit --locked
      - name: 'composer validate (site/build)'
        working-directory: site/build
        run: composer validate --strict
      - name: 'composer audit (site/build)'
        working-directory: site/build
        run: composer audit --locked
  phpstan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: ./.github/actions/setup
      - name: composer install
        working-directory: app
        run: composer install --no-interaction --prefer-dist
      - name: 'phpstan check'
        run: 'castor qa:phpstan'
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: tests (PHP ${{ matrix.php }})
    strategy:
      fail-fast: false
      matrix:
        # app/composer.json allows ">=8.4.1": test the lowest and the latest.
        php: [ "8.4", "8.5" ]
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup
        uses: ./.github/actions/setup
        with:
          php-version: ${{ matrix.php }}
      - name: composer install
        working-directory: app
        run: composer install --no-interaction --prefer-dist
      - name: tests
        run: castor qa:test
