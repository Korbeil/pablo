name: Binary
# The standalone `pablo` binary: a Box phar of the app combined with a static
# PHP (static-php-cli micro.sfx), per OS/arch. Built on every pull request
# (nothing published) and on demand.
#
# Releases: `castor release:create` dispatches this workflow on main with
# release=true. The version job names the release after the UTC date
# (YYYYMMDD: 20261114, then 20261114.1, 20261114.2, … for the same day's next
# releases), which the binaries report. Only once the four builds pass does the release job create
# the GitHub Release (tag and title = that name), with the binaries and their
# sha256sums.txt, flagged "latest" unless latest=false.
# Creating the release last means `releases/latest` (what
# https://getpablo.dev/installer and `pablo update` read) never points at a
# release without binaries.
#
# Same steps as `castor build:binary` (castor.php); keep EXTENSIONS and the
# micro:combine ini in step with BINARY_EXTENSIONS / BINARY_INI there.
on:
  pull_request: ~
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release named after the UTC date: YYYYMMDD, then YYYYMMDD.1, .2… the same day (main only)"
        type: boolean
        default: false
      latest:
        description: "Flag that release as the latest one (what the installer and pablo update install)"
        type: boolean
        default: true

concurrency:
  group: binary-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a release run halfway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PHP_VERSION: "8.5"
  EXTENSIONS: "phar,ctype,iconv,mbstring,tokenizer,filter,posix,pcntl,dom,xml,zlib,openssl"
  # No opcache.enable_cli=1: with PHP 8.5 micro it segfaults at startup.
  MICRO_INI: "memory_limit=512M"

jobs:
  # The version written into the binaries, computed once for the four builds.
  # A release: YYYYMMDD, the UTC date, suffixed .1, .2, … for the same
  # day's next releases (release runs on main never overlap: see
  # concurrency, they queue). Anything else: the first 7 characters of the
  # commit SHA, as `castor build:binary` (never `git describe`).
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$RELEASE" != true ]; then
            echo "version=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tags="$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[] | "\(.name) \(.commit.sha)"')"
          existing="$(printf '%s\n' "$tags" | awk -v sha="$GITHUB_SHA" '$2 == sha { print $1 }')"
          if [ -n "$existing" ]; then
            echo "this commit already has a release: $existing" >&2
            exit 1
          fi
          # The day's first release is YYYYMMDD, the next ones YYYYMMDD.1, .2, …
          # last: -1 when the day has none, 0 for YYYYMMDD alone, else the highest N.
          day="$(date -u +%Y%m%d)"
          last="$(printf '%s\n' "$tags" | awk -v day="$day" 'BEGIN { max = -1 } $1 == day && max < 0 { max = 0 } { n = substr($1, length(day) + 2) } index($1, day ".") == 1 && n ~ /^[0-9]+$/ && n + 0 > max { max = n + 0 } END { print max }')"
          if [ "$last" -lt 0 ]; then version="$day"; else version="$day.$((last + 1))"; fi
          echo "release name: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            spc: spc-linux-x86_64
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            spc: spc-linux-aarch64
          - target: macos-arm64
            runner: macos-latest
            spc: spc-macos-aarch64
          - target: macos-x86_64
            runner: macos-15-intel
            spc: spc-macos-x86_64
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup PHP (build only)
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          coverage: none
          extensions: mbstring, dom, xml
          ini-values: phar.readonly=0
          tools: box

      - name: composer install (no-dev)
        working-directory: app
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress -a --classmap-authoritative

      - name: compile the dashboard assets
        working-directory: app
        run: php bin/console asset-map:compile --env=prod --no-debug

      # The version job's value: the release name on a release.
      - name: version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          php -r '
            $config = json_decode(file_get_contents("app/box.json"), true, flags: JSON_THROW_ON_ERROR);
            $config["replacements"] = ["package_version" => getenv("VERSION")];
            file_put_contents("app/box.json", json_encode($config, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));
          '
          grep -A2 replacements app/box.json

      - name: box compile
        working-directory: app
        run: box compile --no-interaction

      - name: phar smoke test
        run: |
          mkdir -p "$RUNNER_TEMP/phar-home"
          HOME="$RUNNER_TEMP/phar-home" php dist/pablo.phar --version

      - name: download static-php-cli
        run: |
          mkdir -p "$RUNNER_TEMP/spc"
          curl -fsSL "https://dl.static-php.dev/static-php-cli/spc-bin/nightly/${{ matrix.spc }}.tar.gz" | tar -xz -C "$RUNNER_TEMP/spc"
          chmod +x "$RUNNER_TEMP/spc/spc"
          "$RUNNER_TEMP/spc/spc" --version

      # actions/cache keys cannot contain commas: the extension list goes in with dashes.
      - name: static-php-cli cache key
        id: spc-key
        run: echo "key=spc-${{ matrix.target }}-php${PHP_VERSION}-$(printf '%s' "$EXTENSIONS" | tr ',' '-')-micro-cli" >> "$GITHUB_OUTPUT"

      - name: cache static-php-cli downloads and build
        uses: actions/cache@v6
        with:
          path: |
            ${{ runner.temp }}/spc/downloads
            ${{ runner.temp }}/spc/buildroot
          key: ${{ steps.spc-key.outputs.key }}

      # micro.sfx runs PABLO; the PHP CLI (same version and extensions) is
      # embedded as bin/php, for `pablo web`: micro has no php -S.
      - name: build micro.sfx and the PHP CLI
        working-directory: ${{ runner.temp }}/spc
        # spc lists static-php-cli-hosted's releases through the GitHub API:
        # anonymous, that call shares the runner's 60 requests/hour and fails
        # with a 403 on a cold cache (every new PR scope starts cold).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f buildroot/bin/micro.sfx ] && [ -f buildroot/bin/php ]; then
            echo "micro.sfx and php restored from cache"
            exit 0
          fi
          ./spc doctor --auto-fix
          ./spc download --for-extensions="$EXTENSIONS" --with-php="$PHP_VERSION" --prefer-pre-built --retry=3
          ./spc build "$EXTENSIONS" --build-micro --build-cli

      # Same as embed_php_cli() in castor.php.
      - name: embed the PHP CLI
        run: |
          php_cli="$RUNNER_TEMP/spc/buildroot/bin/php"
          "$php_cli" -n -d phar.readonly=0 -r '$p = new Phar($argv[1]); $p->addFile($argv[2], "bin/php"); $p["bin/php"]->compress(Phar::GZ);' -- dist/pablo.phar "$php_cli"

      - name: micro:combine
        working-directory: ${{ runner.temp }}/spc
        run: |
          ./spc micro:combine "$GITHUB_WORKSPACE/dist/pablo.phar" \
            --with-micro=buildroot/bin/micro.sfx \
            --output="$GITHUB_WORKSPACE/dist/pablo-${{ matrix.target }}" \
            -I "$MICRO_INI"
          chmod +x "$GITHUB_WORKSPACE/dist/pablo-${{ matrix.target }}"

      - name: smoke test (Linux, no PHP installed)
        if: startsWith(matrix.target, 'linux-')
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE/dist:/dist:ro" -e HOME=/tmp debian:stable-slim bash -euc '
            if command -v php >/dev/null 2>&1; then echo "php must not be installed here" >&2; exit 1; fi
            pablo=/dist/pablo-${{ matrix.target }}
            $pablo --version
            $pablo list
            # The dashboard, from the PHP CLI the binary carries; parallel
            # requests too, as a browser loading the page and its assets sends.
            mkdir -p /tmp/.pablo/projects
            $pablo web --port 18321 > /tmp/web.log 2>&1 &
            get() { exec 3<>/dev/tcp/127.0.0.1/18321 && printf "GET $1 HTTP/1.0\r\nHost: 127.0.0.1\r\n\r\n" >&3 && head -n 1 <&3; }
            for i in $(seq 1 60); do (exec 3<>/dev/tcp/127.0.0.1/18321) 2>/dev/null && break; sleep 0.5; done
            pids=""
            for i in $(seq 1 12); do get / > /tmp/status-$i & pids="$pids $!"; done
            for pid in $pids; do wait $pid || true; done
            cat /tmp/status-*
            if grep -L " 200 " /tmp/status-* | grep -q .; then cat /tmp/web.log; exit 1; fi
          '

      - name: smoke test (macOS)
        if: startsWith(matrix.target, 'macos-')
        run: |
          export HOME="$RUNNER_TEMP/smoke-home"
          mkdir -p "$HOME"
          dist/pablo-${{ matrix.target }} --version
          dist/pablo-${{ matrix.target }} list
          mkdir -p "$HOME/.pablo/projects"
          dist/pablo-${{ matrix.target }} web --port 18321 > "$RUNNER_TEMP/web.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs -o /dev/null http://127.0.0.1:18321/ && break; sleep 0.5; done
          pids=""
          for i in $(seq 1 12); do curl -fs -o /dev/null -w '%{http_code}\n' http://127.0.0.1:18321/ & pids="$pids $!"; done
          failed=0
          for pid in $pids; do wait "$pid" || failed=1; done
          kill %1
          if [ "$failed" = 1 ]; then cat "$RUNNER_TEMP/web.log"; exit 1; fi

      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: pablo-${{ matrix.target }}
          path: dist/pablo-${{ matrix.target }}
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The name the build jobs wrote into the binaries.
      - name: release name
        id: name
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

      - name: download the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: pablo-*
          path: release
          merge-multiple: true

      - name: checksums
        working-directory: release
        run: |
          chmod +x pablo-*
          sha256sum pablo-* > sha256sums.txt
          cat sha256sums.txt

      # `pablo update` compares this output with the release name: they must match.
      - name: the binaries report the release name
        env:
          TAG: ${{ steps.name.outputs.tag }}
        run: |
          mkdir -p "$RUNNER_TEMP/home"
          version="$(HOME="$RUNNER_TEMP/home" release/pablo-linux-x86_64 --version)"
          echo "$version"
          [ "$version" = "pablo $TAG" ] || { echo "expected: pablo $TAG" >&2; exit 1; }

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          LATEST: ${{ inputs.latest }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists" >&2
            exit 1
          fi
          gh release create "$TAG" release/pablo-* release/sha256sums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            --latest="$LATEST"
