name: Website

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", "bin/**", ".github/workflows/pages.yml" ]
  pull_request:
    paths: [ "site/**", "bin/**", ".github/workflows/pages.yml" ]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so that "Re-run failed jobs" only
  # re-runs the deploy: re-running a job that uploads the artifact again
  # leaves two "github-pages" artifacts and deploy-pages refuses to pick one.
  #
  # The build also runs on pull requests: it fails on a broken internal link
  # (page:… / #anchor), so a docs change is checked before it is merged.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup-php
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      - name: install
        run: composer install --no-interaction --no-progress --working-dir=site/build
      - name: phpstan
        run: site/build/vendor/bin/phpstan analyse --configuration=site/build/phpstan.neon --no-progress
      # site/installer is run straight from the web (curl | bash): a broken
      # script must fail the pull request, not the first user.
      - name: lint shell scripts
        run: |
          bash -n site/installer
          shellcheck --severity=warning site/installer
      - name: build
        run: php site/build/build.php --base=/
      - name: configure-pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
      - name: upload
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    steps:
      # The Pages API intermittently answers 500 on deployment creation;
      # retry twice with a growing pause before giving up.
      - name: deploy
        id: deploy-1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: wait before retry
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30
      - name: deploy (retry 1)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: wait before retry
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60
      - name: deploy (retry 2)
        id: deploy-3
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
