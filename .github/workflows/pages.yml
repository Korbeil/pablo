name: Website

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", ".github/workflows/pages.yml" ]
  workflow_dispatch: ~

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs so that "Re-run failed jobs" only
  # re-runs the deploy: re-running a job that uploads the artifact again
  # leaves two "github-pages" artifacts and deploy-pages refuses to pick one.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: configure-pages
        uses: actions/configure-pages@v6
      - name: upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy-1.outputs.page_url || steps.deploy-2.outputs.page_url || steps.deploy-3.outputs.page_url }}
    steps:
      # The Pages API intermittently answers 500 on deployment creation;
      # retry twice with a growing pause before giving up.
      - name: deploy
        id: deploy-1
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: wait before retry
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 30
      - name: deploy (retry 1)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: wait before retry
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        run: sleep 60
      - name: deploy (retry 2)
        id: deploy-3
        if: steps.deploy-1.outcome == 'failure' && steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v5
