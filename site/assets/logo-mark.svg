<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PABLO">
  <title>PABLO</title>
  <!-- Two state nodes, a hammock-shaped transition between them, the sun rising behind:
       a state machine that does the boring work while you relax. -->
  <rect width="64" height="64" rx="15" fill="#2b2b2a"/>
  <circle cx="32" cy="27" r="9" fill="#e9ce37"/>
  <path d="M13 26 Q32 56 51 26" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
  <circle cx="13" cy="26" r="5.5" fill="#ffffff"/>
  <circle cx="51" cy="26" r="5.5" fill="#ffffff"/>
</svg>
