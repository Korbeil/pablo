[tool.poetry]
name = "pablo"
version = "0.1.0"
description = "PABLO — Personal Assistant for Boring Logic & Operations. AI orchestrator for OpenCode/Orca-managed projects."
authors = ["Baptiste Leduc <baptiste.leduc@gmail.com>"]
readme = "README.md"
packages = [{ include = "pablo", from = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
pyyaml = "^6.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[tool.poetry.scripts]
pablo = "pablo.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
