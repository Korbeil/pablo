# PABLO-wide (cross-project) defaults. Projects override these per key in
# their own config under ~/.pablo/projects/ (or PABLO_PROJECTS_DIR).
sync:
  strategy: rebase
  auto_apply: false
  interval_minutes: 720
state_polling:
  interval_minutes: 10
review:
  bot_whitelist: []
ci:
  ignore_checks: ["approval"]
# Model id format follows agent_runtime: provider/model for OpenCode,
# an alias (sonnet, opus, haiku) or full model id for Claude Code.
default_model: opencode-go/glm-5.3-flash
pr_description_locale: en
# agent_runtime: opencode | claude-code  (default: opencode)
# The program that runs the agents. With claude-code, PABLO launches
# `claude -p` with its agents from ~/.pablo/claude/agents.json (never
# installed in ~/.claude/agents), links /pablo-commit-and-pr and the
# pablo-task skill into ~/.claude, and needs a Claude model above, e.g.
#   default_model: sonnet
# Re-run ./bin/install.sh after changing it. Also settable with
# PABLO_AGENT_RUNTIME. Not compatible with agent_backend: openchamber.
# agent_backend: orca | openchamber  (default: orca)
# OpenChamber is an alternative agent runner (directory-based; no Orca repo
# registration or worktree adoption needed). Set it here or via the
# PABLO_AGENT_BACKEND env var. When it differs from `orca`, `pablo
# system:doctor`/`system:setup` check the openchamber CLI too.