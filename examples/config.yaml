# PABLO-wide (cross-project) defaults. Projects override these per key in
# their own config under ~/.pablo/projects/ (or PABLO_PROJECTS_DIR).
sync:
  strategy: rebase
  auto_apply: false
  interval_minutes: 720
state_polling:
  interval_minutes: 10
review:
  bot_whitelist: []
ci:
  ignore_checks: ["approval"]
# Model id format follows agent_runtime: provider/model for OpenCode,
# an alias (sonnet, opus, haiku) or full model id for Claude Code, a
# Copilot model id (dotted, e.g. claude-sonnet-5.5) for Copilot.
default_model: opencode-go/glm-5.3-flash
pr_description_locale: en
# hooks:                 # your own command on task events (PABLO sends nothing itself)
#   command: 'notify-send PABLO "$PABLO_TASK: ${PABLO_TO:-$PABLO_AGENT finished}"'
#   # macOS: 'osascript -e "display notification \"$PABLO_TASK: $PABLO_TO\" with title \"PABLO\""'
#   states: [request-changes, testing-failed, ci-red, approved, closed]  # optional filter
#   agent_finished: true  # also when an auto-launched agent's analysis is ready
# Runs detached with PABLO_EVENT (transition | agent-finished), PABLO_TASK,
# PABLO_PROJECT, PABLO_FROM, PABLO_TO, PABLO_STATE, PABLO_AGENT, PABLO_PR_URL,
# PABLO_ISSUE_KEY, PABLO_WORKTREE. A project file can override it per key.
# dashboard_port: 8321   # the port of `pablo web` and its service (127.0.0.1 only)
# dashboard_trusted_hosts: [pablo.home.arpa]   # extra names the dashboard answers
#                          # (exact names, besides 127.0.0.1 and localhost)
# scheduler:
#   path: [~/tools/bin]  # extra dirs first on the services' PATH (re-run system:install)
# prune:
#   keep_days: 10        # days of logs system:prune keeps (daily at 03:00; at least 1)
# dispatch:
#   poll_concurrency: 2  # projects the background job polls at once (1-8; 1 = one after the other)
# shell_completion: false  # do not install the shell completion (pablo system:install --without-completion)
# agent_runtime: opencode | claude-code | copilot  (default: opencode)
# The runtime: the agent CLI that runs the agents. With claude-code, PABLO launches
# `claude -p` with its agents from ~/.pablo/runtime/claude/agents.json, links the
# agents into ~/.claude/agents as pablo-<agent> (visible in /agents and the
# @ picker), links /pablo-commit-and-pr and the pablo-task skill into ~/.claude, and needs a Claude model above, e.g.
#   default_model: sonnet
# With copilot, PABLO launches `copilot -p` with its agents linked into
# ~/.copilot/agents as pablo-<agent> (so you can run them yourself too),
# links /pablo-commit-and-pr and pablo-task as Copilot skills, and needs a
# Copilot model above, e.g.
#   default_model: claude-sonnet-5.5
# Re-run `pablo system:install` after changing it. Also settable with
# PABLO_AGENT_RUNTIME. Only opencode works with agent_backend: openchamber.
# claude_code:
#   remote_control: true   # default: true
# With claude-code, runs with no terminal (agent_backend: headless, Orca's
# fallback, the rebase-conflict resolver) are Remote Control sessions you can
# follow live from claude.ai/code and the Claude apps; false keeps `claude -p`.
# Also settable with PABLO_CLAUDE_REMOTE_CONTROL=0/1.
# agent_backend: orca | openchamber | headless  (default: orca)
# The agent environment (ADE: Orca, OpenChamber or headless): where the
# agents run. OpenChamber is an alternative ADE (directory-based; no Orca repo
# registration or worktree adoption needed). Set it here or via the
# PABLO_AGENT_BACKEND env var. The doctor (`pablo system:doctor`/`system:setup`)
# only checks the selected backend's CLI: openchamber instead of orca
# (neither with headless).