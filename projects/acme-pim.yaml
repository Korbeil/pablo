name: acme-pim
type: work
repo:
  path: ~/Sites/acme/pim
  primary_branch: main
issue_tracker:
  provider: jira
  identity: baptiste@example.com
  project_key: XXX
  site: acme.atlassian.net   # Atlassian site for the MCP cloudId
testing:
  failure_signal: "A FIX"   # Jira status watched on the linked issue
ci:
  # CircleCI approval gates (deploy-code-approval-ppr/prod/qlf) show up as
  # StatusContext entries stuck at state PENDING forever since nobody
  # approves them — confirmed on a sample PR's statusCheckRollup. Matched by
  # the "approval" substring in their context string
  # (ci/circleci: tests_workflow/deploy-code-approval-*), so evaluate_ci
  # skips them and CI can still resolve to green.
  ignore_checks: ["approval"]
# worktrees_root omitted -> ~/.pablo/worktrees/pim/
# sync / state_polling / review omitted -> projects/default.yaml
# (rebase, auto_apply false, 30 min sync, 10 min polling, no bot whitelist)
